name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Deployment-only retries must reuse the producing build's artifact name.
      pages-artifact: github-pages-${{ github.run_attempt }}
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Preserve the wheel package index
        shell: bash
        run: |
          ./.github/scripts/preserve_wheel_indexes.sh docs/public
          if [[ ! -f docs/public/nightly/sonar/index.html ]]; then
            mkdir -p docs/public/nightly/sonar
            printf '%s\n' '<!doctype html><html><body></body></html>' \
              > docs/public/nightly/sonar/index.html
          fi
          mkdir -p docs/public/whl docs/public/simple/sonar
          cp \
            docs/public/nightly/sonar/index.html \
            docs/public/whl/index.html
          cp \
            docs/public/nightly/sonar/index.html \
            docs/public/simple/sonar/index.html
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.8
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Build site
        working-directory: docs
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.pages-artifact }}
