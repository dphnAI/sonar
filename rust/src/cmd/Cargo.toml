serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
thiserror-ext.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
sonar-bench.workspace = true
sonar-build-info.workspace = true
sonar-chat.workspace = true
sonar-engine-core-client.workspace = true
sonar-managed-engine.workspace = true
sonar-server.workspace = true
sonar-text.workspace = true
sonar-tracing.workspace = true

[dev-dependencies]
expect-test.workspace = true

[lints]
workspace = true
